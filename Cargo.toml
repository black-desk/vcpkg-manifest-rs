[package]
name = "vcpkg-manifest"
version = "0.1.1"
edition = "2021"
description = "A build.rs library to find C/C++ dependencies via vcpkg or system-wide search"
license = "GPL-3.0-or-later"
repository = "https://github.com/black-desk/vcpkg-manifest-rs"
keywords = ["build-dependencies", "vcpkg", "cmake"]
categories = ["development-tools::build-utils"]

[dependencies]
cmake-package = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
